name: apply-autofix-abcd
on:
  push:
    branches: [piotr/autofix-runner]
    paths:
      - "_agent/autofix-20261020/**"
      - ".github/workflows/apply-autofix.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "pdurlej"
          git config user.email "1210027+pdurlej@users.noreply.github.com"
      - name: Assemble A.00/B.00 segs into chunks, rebuild A/B, force-update tips
        run: |
          set -euo pipefail
          ROOT="_agent/autofix-20261020"
          python3 <<'PY'
          from pathlib import Path
          root = Path("_agent/autofix-20261020")
          chunks = root / "chunks"
          segs = root / "segs"
          for stem in ["A.00.hex", "B.00.hex"]:
              parts = sorted(segs.glob(f"{stem}.*"))
              if not parts:
                  print(f"no segs for {stem}; keeping existing chunk")
                  continue
              data = "".join(p.read_text() for p in parts)
              (chunks / stem).write_text(data)
              print(f"assembled {stem} from {len(parts)} segs -> {len(data)} chars")
          expected = {"A": 28629, "B": 26532}
          for name in ["A", "B"]:
              parts = sorted(chunks.glob(f"{name}.*.hex"))
              if not parts:
                  raise SystemExit(f"missing chunks for {name}")
              data = bytes.fromhex("".join(p.read_text().strip() for p in parts))
              (root / f"{name}.patch").write_bytes(data)
              print(name, "bytes", len(data), "parts", len(parts), "expected", expected[name])
              if len(data) != expected[name]:
                  raise SystemExit(f"{name} size mismatch: {len(data)} != {expected[name]}")
          go3 = (root / "GO3").exists()
          print("GO3 present" if go3 else "GO3 absent")
          open("/tmp/go3_flag", "w").write("1" if go3 else "0")
          PY
          if ! git diff --quiet -- "$ROOT/chunks/A.00.hex" "$ROOT/chunks/B.00.hex" 2>/dev/null; then
            git add "$ROOT/chunks/A.00.hex" "$ROOT/chunks/B.00.hex"
            git commit -m "chore(agent): assemble A.00+B.00 chunks from segs"
            git push origin HEAD:piotr/autofix-runner
          fi
          if [ "$(cat /tmp/go3_flag)" != "1" ]; then exit 0; fi
          git remote add upstream https://github.com/mvschwarz/openrig.git || true
          git fetch upstream main
          echo "upstream/main=$(git rev-parse upstream/main)"
          apply_one() {
            local branch="$1" patch="$2"
            git checkout -B "$branch" upstream/main
            git am --3way "$ROOT/$patch"
            git push -f origin "HEAD:refs/heads/$branch"
            echo "Pushed $(git rev-parse HEAD) -> $branch"
          }
          apply_one "piotr/upstream-pr1-readonly-mcp-events" "A.patch"
          apply_one "piotr/upstream-harness-registry-interim" "B.patch"
          git checkout piotr/autofix-runner || git checkout -B piotr/autofix-runner
